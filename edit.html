<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="stylesheet" href="style.css"><title>編集</title></head><body><header class="topbar"><a class="back" href="index.html">‹</a><h1>編集</h1><span class="version">v4.0.0</span></header><main class="wrap"><form id="recordForm" class="form-card"><input id="recordId" type="hidden"><div class="grid"><div class="field"><label for="owner">お客さん</label><input id="owner" autocomplete="off"></div><div class="field"><label for="building">建物名 *</label><input id="building" required autocomplete="off"></div><div class="field"><label for="lineChoice">路線</label><select id="lineChoice"></select></div><div id="otherLineWrap" class="field" hidden><label for="otherLine">路線名</label><input id="otherLine"></div><div class="field"><label for="stationChoice">駅</label><select id="stationChoice"></select></div><div id="otherStationWrap" class="field" hidden><label for="otherStation">駅名</label><input id="otherStation"></div><div class="field"><label for="walk">徒歩（分）</label><input id="walk" type="number" min="0" inputmode="numeric"></div><div class="field"><label for="builtYearValue">建築年次</label><select id="builtYearValue"></select></div><div class="field"><label for="age">築年数</label><input id="age" readonly></div><div class="field"><label for="structure">構造</label><select id="structure"></select></div><div class="field"><label for="layoutChoice">間取り</label><select id="layoutChoice"></select></div><div id="otherLayoutWrap" class="field" hidden><label for="otherLayout">間取り名</label><input id="otherLayout"></div><div class="field"><label for="sqm">面積（㎡）</label><input id="sqm" type="number" min="0" step="0.01" inputmode="decimal"></div><div class="field"><label for="tsubo">坪数</label><input id="tsubo" readonly></div><div class="field"><label for="revisionMonth">改定年月</label><input id="revisionMonth" type="month"></div><div class="field"><label for="rent">家賃（円）</label><input id="rent" type="number" min="0" inputmode="numeric"></div><div class="field"><label for="rentPerTsubo">坪単価</label><input id="rentPerTsubo" readonly></div><div class="field full"><label for="memo">メモ</label><textarea id="memo"></textarea></div></div><button class="btn save" type="submit">保存</button></form></main><script src="data.js"></script><script src="storage.js"></script><script src="form.js"></script></body></html>
